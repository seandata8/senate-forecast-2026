[project]
name = "senate-forecast-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sean Murphy", email = "seandata8@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "openai>=3.35.1",
    "pandera[polars]>=0.34.1",
    "polars>=2.0.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
]

[project.scripts]
senate-forecast-2026 = "senate_forecast_2026:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
website = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "plotly>=7.1.0",
    "pyyaml>=6.0.3",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
